services:
  # Overrides the base app service with the devcontainer image
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ../..:/workspaces:cached
      - /workspaces/Table-Reclamation-Demo/.venv
    # network_mode: service:db
    command: sleep infinity

  db_rag:
    image: pgvector/pgvector:pg18-trixie
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    command: >
      postgres -c "initdb.d-command=CREATE EXTENSION IF NOT EXISTS vector;"
    ports:
      - "5423:5432"
    restart: always
