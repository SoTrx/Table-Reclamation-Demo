[project]
name = "table-reclamation-demo"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Ahmad Fares", email = "ahmad.fares@univ-grenoble-alpes.fr" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.4.4",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "streamlit>=1.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["table_reclamation"]

[tool.setuptools]
py-modules = ["demo"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
